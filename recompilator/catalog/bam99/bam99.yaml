name: Bust-A-Move 99 (USA)
sha1: 8d874677cfbfa88c5e52bc13327d518be3b756ba
options:
  basename: bam99
  target_path: baserom.z64
  base_path: .
  build_path: build
  asm_path: asm
  src_path: src
  asset_path: assets
  ld_script_path: build/bam99.ld
  compiler: IDO
  platform: n64
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  symbol_addrs_path: symbol_addrs.txt
  find_file_boundaries: false
  use_legacy_include_asm: false
  disassemble_all: false
  mips_abi_float_regs: numeric
segments:
  - name: header
    type: header
    start: 0x0
  - name: ipl3
    type: bin
    start: 0x40
  - name: main
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, asm, main_80000400]
      - [0x1158, asm, main_80000558]
      - [0x116C, bin, main_8000056C]
      - [0x1184, asm, main_80000584]
      - [0x1870, bin, main_80000C70]
      - [0x789C4, asm, main_80077DC4]
      - [0x7A14C, bin, main_8007954C]
      - [0x7A1F8, asm, main_800795F8]
      - [0x7A204, bin, main_80079604]
      - [0x7DFDC, asm, main_8007D3DC]
      - [0x7E770, bin, main_8007DB70]
      - [0x81B10, asm, main_80080F10]
      - [0xAD838, bin, main_800ACC38]
      - [0xADDA0, asm, main_800AD1A0]
      - [0xAFF3C, bin, main_800AF33C]
      - [0xB08DC, asm, main_800AFCDC]
      - [0xB8E04, bin, main_800B8204]
      - [0xB940C, asm, main_800B880C]
      - [0xBA654, bin, main_800B9A54]
      - [0xBAE88, asm, main_800BA288]
      - [0xBB018, bin, main_800BA418]
  - name: assets
    type: bin
    start: 0x101000
  - [0x800000]
