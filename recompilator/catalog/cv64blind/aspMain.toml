# RSPRecomp config for Castlevania's Konami audio microcode (aspMain), blind tree.
#
# WHY IT IS HERE (2026-09-07): the recompiled microcode - rsp/aspMain.cpp - is derived from the
# cartridge and can never ship, so a user's machine has to regenerate it. That needs this file: a
# handful of addresses and names, the same class of fact as the rest of a catalog entry. Until now
# every tree's aspMain.cpp had been generated once, by hand, years of sessions ago, and the pipeline's
# RSP MICROCODE stage was a pass-through - so the first catalog build on a clean machine linked
# everything and then failed on one undefined symbol: aspMain.
#
# The values are the cartridge's, established on cv64pc and unchanged here (same cart, same ucode):
#   text_offset/size  the microcode's text in the ROM. The size runs past aspMainTextEnd to 0xE20
#                     to take in the trailing 0x44-byte block a jump target lives in.
#   text_address      0x04001080, NOT 0x04001000: audio and graphics microcode is DMA'd into IMEM at
#                     offset 0x80 (the first 0x80 bytes are the task header) and aspMain's jump
#                     targets are IMEM-absolute. With the wrong base every indirect dispatch landed
#                     32 instructions past its handler, which is what the old audio "spin" was.
#   extra_indirect_branch_targets
#                     the audio command jump table, which the recompiler cannot follow statically:
#                     eight .words in aspMainData packing two 16-bit handler offsets each.
text_offset = 0x91D30
text_size = 0xE20
text_address = 0x04001080
rom_file_path = "baserom.z64"
output_file_path = "../cv64blindpc/rsp/aspMain.cpp"
output_function_name = "aspMain"

extra_indirect_branch_targets = [
    0x1118, 0x1470, 0x11DC, 0x1B38, 0x1214, 0x187C, 0x1254, 0x12D0,
    0x12EC, 0x1328, 0x140C, 0x1294, 0x1E24, 0x138C, 0x170C, 0x144C,
]
