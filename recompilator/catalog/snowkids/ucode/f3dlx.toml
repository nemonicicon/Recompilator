# RSPRecomp config for the F3DEX-1.x GFX FAMILY — reference specimen: "RSP Gfx ucode F3DLX 1.23"
# (Snowboard Kids). CATALOG RUNG (ENGINE_LEDGER 2026-07-23 ucode doctrine): this cracks the 1.x
# family LAYOUT; the census ranks ~120+ game-slots on this line (F3DEX/F3DLX/F3DLP/L3DEX x
# .Rej/.NoN x 1.21/1.23), which port off this toml as parameter deltas, pilotwings-style.
#
# Layout decoded 2026-07-23 from the ucode's OWN data header (ucode_data +0x00..+0x27,
# {ucode-rel offset, len-1, IMEM dest} triplets — no game knowledge involved):
#   +000: main text  0x0000, 0xF80 bytes -> IMEM 0x080   (boot stub region below)
#   +008: overlay 0  0x0F80, 0x88  bytes -> IMEM 0x000   (low-IMEM slot, boot region reuse)
#   +010: overlay 1  0x1008, 0x220 bytes -> IMEM 0x748   (swap slot: clip/geometry variants)
#   +018: overlay 2  0x1228, 0x198 bytes -> IMEM 0x748
#   +020: overlay 3  0x13C0, 0x70  bytes -> IMEM 0x748
# GBI dispatch table: 40 u16 handlers at ucode_data +0xB6 (all listed below).
# SK1 instance: text ROM 0xB28C0 (VRAM 0x800B1CC0), data ROM 0xE2DC0 (VRAM 0x800E21C0),
# fingerprinted from the live OSTask ([sp] osSpTaskStartGo type=1) + segment map (main
# ROM 0x1000 <-> VRAM 0x80000400).
text_offset = 0xB28C0
text_size = 0x1000
text_address = 0x04001000
text_load_offset = 0x80
rom_file_path = "../snowkids/baserom.z64"
output_file_path = "RecompiledFuncs/f3dlx.cpp"
output_function_name = "f3dlx"

# The 40-entry GBI dispatch table (unique targets), ucode_data +0xB6 — PLUS the runtime-computed
# in-slot dispatch targets the table can't show (0x1824/0x182C/0x1968), found empirically by the
# interp's RSP_JUMP_CENSUS over 16 live SK1 task captures (2026-07-24, f3dlx_ab oracle rung).
# Census sites: pc 0x108 (command-loop jr $21) -> 0x824; pc 0x0E4 -> 0x82C; pc 0x1D4 -> 0x968.
extra_indirect_branch_targets = [
    0x1058, 0x109C, 0x11A4, 0x11B4, 0x11DC, 0x11FC, 0x1230, 0x1248,
    0x126C, 0x1274, 0x12B0, 0x12D0, 0x12F0, 0x1308, 0x1318, 0x132C,
    0x1340, 0x1348, 0x1350, 0x13A0, 0x13B8, 0x1580, 0x16FC, 0x170C,
    0x1750, 0x1764, 0x1780, 0x179C, 0x17A0, 0x17F8, 0x180C, 0x1948,
    0x1F80,
    0x1824, 0x182C, 0x1968,
]

# Overlay slot @ IMEM 0x000 (overlay 0 — loaded over the boot stub region).
[[overlay_slots]]
text_address = 0x04001000
  [[overlay_slots.overlays]]
  offset = 0xF80
  size = 0x88

# Overlay slot @ IMEM 0x748 (overlays 1/2/3 swap here).
# F3DEX-1.x FAMILY LAW (found by the A/B oracle + interp jump trace, 2026-07-24): the RESIDENT
# main text UNDER this slot (file 0x6C8..0x8E8 → IMEM 0x748) is REAL, EXECUTED code until the
# first overlay DMA — the ucode's init path dispatches into it (jr@0x108 → 0x824 is transfer #3
# of the whole task, ovl1's DMA is transfer ~#15). F3DEX2 never does this, so the slot model
# assumed overlays own the region. Declaring the resident bytes as overlay INDEX 0 makes the
# initial slot state correct: index 0 is never DMA-selected at runtime (file 0x6C8 never appears
# as a swap source), so it exists purely as the pre-swap content. Port this to every 1.x member.
[[overlay_slots]]
text_address = 0x04001748
  [[overlay_slots.overlays]]
  offset = 0x6C8
  size = 0x220
  [[overlay_slots.overlays]]
  offset = 0x1008
  size = 0x220
  [[overlay_slots.overlays]]
  offset = 0x1228
  size = 0x198
  [[overlay_slots.overlays]]
  offset = 0x13C0
  size = 0x70
