# RESTART copy 2026-07-11: recon VERIFIED against baserom bytes this date (rspboot sig at
# 0xE6268 = 20 01 0F C0 exact; ROM sha-identical to the recon's source ROM). Regenerated
# fresh with our own RSPRecomp run — July outputs not imported. See DESKTOP_BENCH.md.
# RSPRecomp config for SM64's graphics microcode — Fast3D (F3D), Nintendo (launch-era, NOT F3DEX2).
#
# Layout is EMPIRICAL from the runtime OSTask (a `SM64_GFX_LLE=1` run of the general RSP):
#   [sm64gfx] Fast3D ucode=0x8032B330 size=0x1000  data=0x80339AC0 dsize=0x800
# SM64's main segment is rom 0x1000 @ vram 0x80246000, so ROM = vram - 0x80246000 + 0x1000:
#   text  VRAM 0x8032B330 -> ROM 0xE6330  (size 0x1000)
#   data  VRAM 0x80339AC0 -> ROM 0xF4AC0  (size 0x800; ends 0xF52C0 = aspMainData start ✓)
# The shared rspboot (`addiu $1,$0,0xFC0` = 20 01 0F C0) sits at ROM 0xE6268, just before this.
#
# rspboot handoff (same shape as cv64's F3DEX2, verified by the general RSP): the resident text
# DMAs to IMEM 0x080 and the RSP enters at IMEM 0x080. So the recompiled image is the FULL IMEM
# (0x000-0xFFF): base loaded at text_load_offset=0x80 (resident -> IMEM 0x080-0xFFF); IMEM
# 0x000-0x080 is the overlay slot. entry = IMEM 0x080.
text_offset = 0xE6330
text_size = 0x1000
text_address = 0x04001000
text_load_offset = 0x80
rom_file_path = "../sm64/baserom.z64"
output_file_path = "rsp/f3d.cpp"
output_function_name = "f3d"

# GBI command dispatch + overlay handler targets. VERIFIED 2026-07-11 from the ROM bytes
# themselves: the ucode data section (ROM 0xF4AC0) holds ONE contiguous 37-entry table of
# IMEM handler addresses at DMEM 0x0BC — the F3D GBI command dispatch table. Live run
# confirmed the first dispatch jr lands on 0x11FC (table entry #2) and bailed
# UnhandledJumpTarget until these were added. The few values found outside the table
# (0x1000/0x1080/0x1768/...) are the overlay slots + entry point — inert as labels.
# (July's f3d.cpp case list does NOT contain 0x11FC; it was never evidence its LLE ran.)
extra_indirect_branch_targets = [
    0x1000, 0x1058, 0x1080, 0x10A8, 0x11FC, 0x1208, 0x120C, 0x1250,
    0x1288, 0x12A0, 0x12C4, 0x12CC, 0x130C, 0x1328, 0x1348, 0x1358,
    0x1370, 0x1378, 0x1380, 0x1384, 0x138C, 0x13A0, 0x13C4, 0x13DC,
    0x1558, 0x1568, 0x1734, 0x1768, 0x1770, 0x1774, 0x1784, 0x17A0,
    0x17BC, 0x17C0, 0x1818, 0x182C, 0x1964,
]

# F3D IMEM OVERLAYS (captured from the interpreter's imem_dma_in, the byte-exact oracle):
#   [imemdma] imem_off=0x000 src=0x8032C290 len=0x88  → overlay A (ucode-rel offset 0xF60) into IMEM 0x000
#   [imemdma] imem_off=0x768 src=0x8032C6D0 len=0x68  → overlay B (ucode-rel offset 0x13A0) into IMEM 0x768
# Without these RSPRecomp only recompiled the resident (0x080-0xFFF); the DL-advance handler lives in
# overlay A → the DL read pointer never advanced → infinite loop. Same shape as cv64's f3dex2.toml.
[[overlay_slots]]
text_address = 0x04001000    # IMEM 0x000
  [[overlay_slots.overlays]]
  offset = 0xF60
  size = 0x88

# Slot 0x768 — GROUND TRUTH from the ucode's OWN overlay descriptor table at DMEM 0x004
# (entry format {ucode_off, (len-1)<<16|imem}, decoded 2026-07-11 from the ROM data section):
#   entry 0: 0x0000 len 0xF60 imem 0x1080  = the resident text load (rspboot handoff)
#   entry 1: 0x0F60 len 0x088 imem 0x1000  = overlay A (slot 0x000)
#   entry 2: 0x0FE8 len 0x220 imem 0x1768  = CLIPPING overlay   <- live run requested 1720x
#   entry 3: 0x1208 len 0x198 imem 0x1768  = LIGHTING overlay
#   entry 4: 0x13A0 len 0x068 imem 0x1768  = task-done stub (0x177C = status|done + break)
# Option 0 below = the boot-resident bytes for this region (ucode-rel 0x6E8): never re-requested
# by DMA, but it IS the slot's pre-first-swap state, and slots[] initializes to option 0 — so it
# must be first. (Verified boot-resident != lighting bytes, so it is a genuine 4th content.)
# The July toml knew only the task-done entry — its interpreter session never clipped a triangle;
# every clip request then silently ended the task (see the 2026-07-11 hunt in DESKTOP_BENCH.md).
[[overlay_slots]]
text_address = 0x04001768    # IMEM 0x768
  [[overlay_slots.overlays]]
  offset = 0x6E8             # boot-resident content (initial state; covers max swap extent)
  size = 0x220
  [[overlay_slots.overlays]]
  offset = 0xFE8             # clipping overlay
  size = 0x220
  [[overlay_slots.overlays]]
  offset = 0x1208            # lighting overlay
  size = 0x198
  [[overlay_slots.overlays]]
  offset = 0x13A0            # task-done stub
  size = 0x68
