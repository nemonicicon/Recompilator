  - name: assets
    type: bin
    start: 0x101000
  # NOTE (2026-06-18): rom 0x355FB0 (the recomp-flagged "jal 0x802B5xxx" overlay) is COMPRESSED in ROM —
  # disassembling it as code yields 15,619 .word /* invalid instruction */ (0 real instrs). The game
  # DECOMPRESSES it to vram 0x802B5A40 at runtime, so it is RUNTIME-GENERATED CODE (LiveRecomp class),
  # NOT a static code segment. Do NOT add it as type:code. See project_mortalkombattrilogy_port memory.
  - [0xC00000]   # ROM end = 12MB. WAS 0x800000 (an 8MB-template default copied from waverace/pilotwings,
                 # whose ROMs are 8MB) -> left rom 0x800000..0xC00000 (4MB of real asset data) uncovered.
