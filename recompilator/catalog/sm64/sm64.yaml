# Super Mario 64 (USA) — splat-less Recompilator front-end config.
# GAME #3 — the first NON-CV64-family target (no Nisitenma-Ichigo, MIO0 assets).
# SESSION recon (empirical, blind):
#   entrypoint 0x80246000 (rom 0x1000), internal name SUPER MARIO 64, game code NSME
#   main code    rom 0x1000..0xE78A0  @ vram 0x80246000 (prologue-density scan, 8156-hit
#                jal→prologue delta solve for 0x80245000; last jr-ra 0xE7894)
#   main data    rom 0xE78A0..0xF5580
#   lib code     rom 0xF5580..0x102D08 @ vram 0x80378800 (the AUDIO LIBRARY — found by
#                the recompiler's unresolved-jal census: delta 0x80283280 hits 6/6
#                unresolved targets + 730 main-code jals; 0xF5580+delta = round 0x80378800)
#   lib data     rom 0x102D08..0x108A40 (audio tables + RSP microcode blobs)
#   assets1      rom 0x108A40..0x21F4C0 (MIO0-compressed segments)
#   goddard code rom 0x21F4C0..0x257CF0 @ vram 0x8016F000 (delta 0x7FF4FB40, 2058 hits;
#                first delta-consistent prologue lands EXACTLY on 0x8016F000)
#   goddard data rom 0x257CF0..0x26A3A0 (next MIO0 at 0x26A3A0)
#   assets2      rom 0x26A3A0..0x800000 (79 MIO0 blocks ROM-wide)
# float mode: ldc1=316/sdc1=112 in main code => mips3 doubles => uses_mips3_float_mode.
name: Super Mario 64 (USA)
sha1: 9bef1128717f958171a4afac3ed78ee2bb4e86ce
options:
  basename: sm64
  target_path: baserom.z64
  base_path: .
  build_path: build
  asm_path: asm
  src_path: src
  asset_path: assets
  ld_script_path: build/sm64.ld
  compiler: IDO
  platform: n64
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  symbol_addrs_path: symbol_addrs.txt
  find_file_boundaries: false
  use_legacy_include_asm: false
  mips_abi_float_regs: numeric
segments:
  - name: header
    type: header
    start: 0x0
  - name: ipl3
    type: bin
    start: 0x40
  - name: main
    type: code
    start: 0x1000
    vram: 0x80246000
    subsegments:
      - [0x1000, asm, main]
      - [0xE78A0, data, main_data]
  - name: lib
    type: code
    start: 0xF5580
    vram: 0x80378800
    subsegments:
      - [0xF5580, asm, lib]
      - [0x102D08, data, lib_data]
  - name: assets1
    type: bin
    start: 0x108A40
  - name: goddard
    type: code
    start: 0x21F4C0
    vram: 0x8016F000
    subsegments:
      - [0x21F4C0, asm, goddard]
      - [0x257CF0, data, goddard_data]
  - name: assets2
    type: bin
    start: 0x26A3A0
  - [0x800000]
