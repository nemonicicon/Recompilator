name: Bottom of the 9th (USA)
sha1: 4ee0e3768b9f23112e4e5ef0c81a2b29ae22eab2
options:
  basename: bottom9
  target_path: baserom.z64
  base_path: .
  build_path: build
  asm_path: asm
  src_path: src
  asset_path: assets
  ld_script_path: build/bottom9.ld
  compiler: IDO
  platform: n64
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  symbol_addrs_path: symbol_addrs.txt
  find_file_boundaries: false
  use_legacy_include_asm: false
  disassemble_all: false
  mips_abi_float_regs: numeric
# ---------------------------------------------------------------------------------------------
# THE CART'S OWN FILE TABLE (rom 0x48034, 16-byte records: name-ptr, flag, rom start, rom end;
# the names are the ASCII strings at 0x80059Axx-0x80059Bxx). Decoded 2026-09-06:
#     'code'      0x001050..0x064C90   the RESIDENT image (IPL3-loaded at vram 0x80000400)
#     'bb2code'   0x064C90..0x06DA50   |
#     'tpitcode'  0x06DA50..0x0715C0   |
#     'tbatcode'  0x0715C0..0x075860   |  five/six small BANKED code overlays. They call the
#     'tfdrcode'  0x075860..0x078C10   |  SAME vram window 0x8017xxxx-0x801Bxxxx as `selcode`
#     'truncode'  0x078C10..0x07B8C0   |  but only 1 of their 260 distinct targets there lands
#     'tgamecode' 0x07B8C0..0x082070   |  on a function opening at selcode's delta -> they are
#                                      |  ALTERNATIVE bank tenants, not callers. Load addresses
#                                      |  unknown (none is DMA'd in the front end); left as bin.
#     'selcode'   0x082070..0x0CB040   THE FRONT-END OVERLAY -> vram 0x80170000 (declared below)
#     'bbcode'    0x0CB040..0x11FE90   the in-game baseball overlay (same bank; left as bin)
#     ... then 'scenario', 'teams', 'players', 'title', ... = assets
# The old yaml declared ONE flat `main` from 0x1000 to 0x101000, i.e. it treated every one of
# those files as resident code at rom+0x7FFFF400 -- addresses nothing in the cart ever names.
# ---------------------------------------------------------------------------------------------
segments:
  - name: header
    type: header
    start: 0x0
  - name: ipl3
    type: bin
    start: 0x40
  - name: main
    type: code
    start: 0x1000
    vram: 0x80000400   # RESIDENT ('code'): rom 0x1000..0x64C90 -> vram 0x80000400..0x80064090
                       # (delta 0x7FFFF400). Its code ends at 0x800436FC: of the 2,739 jal targets
                       # in rom 0x1000..0x442FC, 2,680 land inside the resident and the HIGHEST is
                       # 0x80041FE0. Its image end 0x80064090 is confirmed at runtime -- the first
                       # thread the game creates is at 0x80064090 ([thrcreate] t=1), i.e. BSS.
    subsegments:
      - [0x1000, asm, main_80000400]
      - [0x1080, asm, main_80000480]
      - [0x3E774, asm, main_8003DB74]
      - [0x3EB50, asm, main_8003DF50]
      - [0x442FC, asm, main_800436FC]
      - [0x46B5C, bin, main_80045F5C]
      - [0x58F10, asm, main_80058310]
      - [0x59BD8, bin, main_80058FD8]
      - [0x5A0B4, asm, main_800594B4]
      - [0x5A0E8, bin, main_800594E8]
      - [0x5A344, asm, main_80059744]
      - [0x5A370, bin, main_80059770]
      - [0x5A864, asm, main_80059C64]
      - [0x5A880, asm, main_80059C80]
      - [0x5AAF4, bin, main_80059EF4]
      - [0x5AD84, asm, main_8005A184]
      - [0x5EB58, asm, main_8005DF58]
      - [0x60C6C, bin, main_8006006C]
      - [0x629B0, bin, main_80061DB0]
  - name: bin_64C90
    type: bin
    start: 0x64C90   # bb2code..tgamecode: banked overlays whose load addresses are not derivable
                     # from the front-end boot (no [piDMA] for them in the 09-05 free look).
  - name: selcode
    type: code
    start: 0x82070
    vram: 0x80170000   # THE FRONT-END CODE OVERLAY (delta 0x800EDF90). Four proofs:
                       #  (1) The engine's own [piDMA] table, 09-05 free look: eighteen lockstep
                       #      transfers cart=0x10082070 -> dram=0x00170000 len=0x4000, stepping to
                       #      cart=0x100C6070 -> dram=0x001B4000 (0x48000 B). The cart's file table
                       #      gives 'selcode' = rom 0x82070..0xCB040 = 0x48FD0 B, so a nineteenth
                       #      transfer of 0xFD0 (below the probe's 0x4000 print threshold) closes
                       #      it exactly. rom 0x82070 itself opens `addiu $sp,$sp,-0x68`.
                       #  (2) jal self-consistency: of the 2,640 jal targets in rom 0x82070..0xC0820,
                       #      849 land inside this segment (831 on a function opening) and 1,791 in
                       #      the resident (1,752 on a function opening) -- ZERO are wild. Under the
                       #      old flat delta the same calls give 0 in-segment and 866 wild.
                       #  (3) The three addresses the engine had to interpret in the free look
                       #      (0x8018F520, 0x80193EA0, 0x801955F0 -- `[kseg0-interp] unresolved ...
                       #      looks like code`, print capped at 24) are jal targets inside this range
                       #      and each disassembles as a clean prologue at this delta; their return
                       #      addresses (0x80021520, 0x80022040, 0x8002209C) are resident code.
                       #  (4) The pre-change emission's failures.json puts 35 of its 48 jal-nomatch
                       #      events on pages 0x8017-0x801B (calls into this segment with no body)
                       #      and 553 of its 1,165 unhandled-opcode events on page 0x800C, which is
                       #      these same ROM bytes disassembled at the wrong vram.
                       # Code ends at rom 0xC0820 (vram 0x801AE7B0) -- the last `jr $ra` in the file
                       # is at 0xC081C, followed by zero padding and then pointer tables/ASCII
                       # (0xC83BC..0xCB03E is this overlay's string table: "sort_top10_pitcher_data
                       # league %d ...", "World Championship"). The old yaml disassembled two spans
                       # of that tail as code at vram 0x800C028C/0x800C2FC8.
    subsegments:
      - [0x82070, asm, selcode_80170000]
      - [0xC0820, bin, selcode_801AE7B0]
  - name: bin_CB040
    type: bin
    start: 0xCB040   # 'bbcode', the in-game overlay: same bank, load address not observed.
  - name: assets
    type: bin
    start: 0x101000
  - [0x1000000]
