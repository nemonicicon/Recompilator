# [pollhook 2026-09-06, BattleTanx: Global Assault #119] func_800A1384 is this game's boot wait and
# is BYTE-IDENTICAL to BattleTanx #293's func_80079064 (34 instruction words compared from both
# baseroms: exactly 2 differ, the lui/addiu pair that forms the block base -- 0x8014E0D0 there,
# 0x80222930 here). It snapshots the 0x200-byte scheduler block at D_80222930 onto its stack every
# iteration and spins until +0x1F4 == 0, +0x1FC == 0 and the retrace counter at +0x1F0 reaches 5
# (sltiu $v0,$v0,5). That block is the game's OSSched: func_800A1150 builds it with
# osCreateMesgQueue(D_80222930, +0x18, 8), osSetEventMesg(SP/DP/PRENMI -> 0x29B/0x29C/0x29E),
# osViSetEvent(D_80222930, 0x29A, ...) and starts func_800A1290 -- a __scMain that blocks on
# osRecvMesg and dispatches msg-0x29A through jtbl_80072680 (5 entries). Only that thread advances
# +0x1F0, in the retrace case func_800A140C (sh $v0,0x1F0($s0) at 0x800A154C), and only after the
# 0x29A VI message arrives. In this engine a VI retrace is an EXTERNAL message delivered solely when
# some guest thread makes an OS call or the idle thread pumps -- and this loop makes no call at all,
# so it starves the very thread it waits for. MEASURED on the 09-06 01:20 free look (20 s):
# [schedyield] 0, tasks sub=0 in all 20 samples, osViSwapBuffer 0, fb-content nonzero=0/8, 0 flips,
# zero pak traffic, 15 [schednext] switches ending on "resume t=2 pri=10" with an EMPTY
# [wedge-dump] park-ring -- the pri-10 main thread was RUNNING, not blocked.
# All four poll-loop detectors reject this back edge (conditional branch, a STORING body, an inner
# branch): the emission declares poll_guard for func_800A1384 and emits ZERO guards in it, while
# emitting 364 elsewhere in this tree. Marking the once-per-iteration point at 0x800A13D8 (offset
# +0x54, the same offset as #293's 0x800790B8; reached on all three back-edge paths) as a yield
# point restores the preemption the VI interrupt would deliver on hardware. Same guard text the
# detectors themselves emit; non-blocking; default-on; no stub and no env gate.
[[patches.hook]]
func = "func_800A1384"
before_vram = 0x800A13D8
text = 'if ((++poll_guard & 0x3F) == 0) { yield_self_poll(rdram, 0x800A1384u, (uint32_t)ctx->r31, 0x800A13D8u); }'
