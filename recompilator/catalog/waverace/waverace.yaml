# Wave Race 64 (USA) — splat-less Recompilator front-end config. GAME #8.
# First-party Nintendo (EAD), standard libultra. Clones the Pilotwings (game #4) pipeline:
# build_*.sh + match_libultra version-invariant detectors + pinned-ld + verify_rom_match gate.
#
# RECON (empirical, 2026-06-13 — boot-stub decode + prologue-density scan):
#   8MB, entry 0x80046800, name "WAVE RACE 64", cart NWRE, region E (USA).
#   SHA1 887ab588c2ecc64c52fb2065f06b0a1ee4af13dc.
#   boot @ rom 0x1000 (vram 0x80046800): BSS-clear loop (zeroes 0x800EEB30 for 0xEC1D0 bytes
#     -> 0x801DAD00), sp=0x80151940, then jr 0x80047A44 (real init/main).
#   CODE base: rom 0x1000 -> vram 0x80046800 (delta 0x80045800). RESIDENT image (code+data+jtbls)
#     rom 0x1000..0xA9330, ends exactly at BSS (vram 0x800EEB30). ONE asm subsegment keeps
#     byte-order exact; data-as-code handled via waverace_stubs.txt (disassemble_all).
#   overlays/assets: rom 0xA9330..0x800000 (Tier D: overlay-heavy; a 2nd code block lives at
#     rom 0x1B1000 = a runtime-relocated overlay — split into its own segment AFTER the
#     byte-exact milestone, via the recompiler's unresolved-jal census, the Pilotwings method).
name: Wave Race 64 (USA)
sha1: 887ab588c2ecc64c52fb2065f06b0a1ee4af13dc
options:
  basename: waverace
  target_path: baserom.z64
  base_path: .
  build_path: build
  asm_path: asm
  src_path: src
  asset_path: assets
  ld_script_path: build/waverace.ld
  compiler: IDO
  platform: n64
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  symbol_addrs_path: symbol_addrs.txt
  find_file_boundaries: false
  use_legacy_include_asm: false
  disassemble_all: true
  mips_abi_float_regs: numeric
segments:
  - name: header
    type: header
    start: 0x0
  - name: ipl3
    type: bin
    start: 0x40
  - name: main
    type: code
    start: 0x1000
    vram: 0x80046800   # rom 0x1000 -> vram 0x80046800 (delta 0x80045800): the header entry/BSS stub
    subsegments:
      - [0x1000, asm, main]   # resident image rom 0x1000..0xA9330, ends at BSS (vram 0x800EEB30)
  - name: ovl00
    type: code
    start: 0xA9330
    vram: 0x801DAD00   # MAIN OVERLAY (overlay-discovery tool): rom 0xA9330 -> vram 0x801DAD00 (delta
                       # 0x801319D0), DMA'd above BSS at boot; the resident jals into it post-logo.
    subsegments:
      - [0xA9330, asm, ovl00]   # size 0x4CB20 (rom 0xA9330..0xF5E50)
  - name: assets
    type: bin
    start: 0xF5E50
  - [0x800000]
