name: "Re-Volt (revolt)"
sha1: 667fdc39112599bd904f5e7d8d692973e554bd88
options:
  basename: revolt
  target_path: baserom.z64
  base_path: .
  build_path: build
  asm_path: asm
  src_path: src
  asset_path: assets
  ld_script_path: build/revolt.ld
  compiler: IDO
  platform: n64
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  symbol_addrs_path: symbol_addrs.txt
  find_file_boundaries: false
  use_legacy_include_asm: false
  disassemble_all: true
  mips_abi_float_regs: numeric
segments:
  - name: header
    type: header
    start: 0x0
  - name: ipl3
    type: bin
    start: 0x40
  # ACCLAIM WINDOW MODEL (acclaim_setup.py, decoded from this cart's own boot stub):
  # stub at KSEG0 0x80000400 maps virtual 0x100000 -> phys 0 and jalr's to
  # 0x001060D4; the body is LINKED AT THE WINDOW (virtual = 0x100000 + phys).
  - name: boot
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, asm, boot_80000400]
  - name: main
    type: code
    start: 0x1164
    vram: 0x00100564   # RESIDENT image, IPL3-loaded: rom 0x1164..0x5E000 -> vram 0x00100564..
                       # 0x0015D400 (delta 0xFF400, i.e. VA = phys + 0x100000 through TLB index 31).
                       # It ENDS at rom 0x5E000 because the cart PI-DMAs rom 0x5E000..0xC7000 out
                       # to phys 0x600000 at boot and runs it at VA 0x00200000 (main2 below); the
                       # bytes left behind at 0x0015D400+ are dead and the game reuses that RAM for
                       # its thread heap (the run log's fibers live at 0x8005C790..0x8007D610 =
                       # phys 0x5C790..0x7D610, i.e. inside this dead tail).
                       # Its own code ends at rom 0x4AB18 (last resident jal target 0x00149F18);
                       # rom 0x4AB18..0x5E000 is resident data that disassemble_all carves as code.
    subsegments:
      - [0x1164, asm, main_00100564]
  - name: main2
    type: code
    start: 0x5E000
    vram: 0x00200000   # SECOND CODE SEGMENT (delta 0x1A2000). The cart's boot DMAs it in ONE
                       # transfer -- the run log's first PI programming is
                       #   PI_DRAM_ADDR=0x00600000  PI_CART_ADDR=0x1005E000  PI_WR_LEN=0x00068FFF
                       # (rom 0x5E000..0xC7000, 0x69000 bytes -> phys 0x600000) -- and maps it with
                       # TLB index 0: `[tlb] write idx=0 hi=0x00200000 mask=0x001FE000
                       # lo0=0x0001801F` = a 1 MB page VA 0x00200000 -> PFN 0x600 = phys 0x600000.
                       # Proofs of the delta:
                       #  (1) jal self-consistency: of the 4218 jal sites in rom 0x5E000..0xC7000,
                       #      2528 land inside this segment at 0x00200000+ and 1682 in the resident
                       #      -- only 8 are wild. Of the 2674 jal sites in the resident, 344 more
                       #      target 0x00200000+. ZERO of the 6892 jal sites in the cart target the
                       #      flat range 0x0015D400..0x001C6400 where the old yaml put these bytes.
                       #  (2) 840 distinct jal targets span 0x00200000..0x00264630 exactly, and
                       #      rom 0x5E000 disassembles as a textbook prologue (addiu $sp,$sp,-0x88).
                       #  (3) The pre-change emission's failures.json puts 1510 of its 1625
                       #      unconditional-branch-unhandled events in the flat range (these same
                       #      ROM bytes disassembled at the wrong vram) and all 875 jal-nomatch
                       #      events on calls into 0x00200000+ that had no body.
                       #  (4) The run log's parked thread pc is 0x00202310 and every module call
                       #      fell to the interpreter (23,292 sessions, 20 M instr/s).
                       # rom 0xC3000.. is this module's data (module code ends at rom 0xC2630).
    subsegments:
      - [0x5E000, asm, main2_00200000]
      - [0xC3000, bin, main2_00265000]
  - name: assets
    type: bin
    start: 0x101000
  - [0xC00000]
