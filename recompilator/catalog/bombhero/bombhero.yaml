name: Bomberman Hero (USA)
sha1: a36364b7e59351f7551ab351cb3b41ebc4be285b
options:
  basename: bombhero
  target_path: baserom.z64
  base_path: .
  build_path: build
  asm_path: asm
  src_path: src
  asset_path: assets
  ld_script_path: build/bombhero.ld
  compiler: IDO
  platform: n64
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  symbol_addrs_path: symbol_addrs.txt
  find_file_boundaries: false
  use_legacy_include_asm: false
  disassemble_all: false
  mips_abi_float_regs: numeric
segments:
  - name: header
    type: header
    start: 0x0
  - name: ipl3
    type: bin
    start: 0x40
  - name: main
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, asm, main_80000400]
      - [0x11E4, asm, main_800005E4]
      - [0x3BAF4, asm, main_8003AEF4]
      - [0x3BEC0, asm, main_8003B2C0]
      - [0x4DD70, bin, main_8004D170]
  - name: gamecode
    type: code
    start: 0x4DFF0
    vram: 0x8005BAD0
    subsegments:
      - [0x4DFF0, asm, gamecode_8005BAD0]
      - [0xF2A40, bin, gamecode_data]
  - name: assets
    type: bin
    start: 0x126CB0
  - [0xC00000]
