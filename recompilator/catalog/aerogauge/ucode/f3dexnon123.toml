# RSPRecomp config for F3DEX.NoN 1.23 — reference specimen: AeroGauge (USA) boot/attract gfx
# ucode (hash-law key 628E11DA58740525, named by the runtime miss counter 2026-07-24).
# CATALOG RUNG: third 1.x-line member through the SK1 recipe — the census row spans 7 games
# (1080 Snowboarding, AeroGauge, Donald Duck, Mini Racers, Quake II, Rayman 2, Yoshi's Story).
#
# Layout decoded 2026-07-24 from the ucode's OWN data header (aerogauge capture gfx_task_0,
# geometry triplets at data+0x00..0x27) — SK1's f3dlx.toml law with ONE parameter delta:
#   main text 0xF80 -> IMEM 0x080 · overlay 0 = 0xF80 (0x88) -> IMEM 0x000 (identical to SK1)
#   swap slot @ IMEM 0x738 (SK1: 0x748) — overlays 1/2/3 same sizes 0x220/0x198/0x70.
# F3DEX-1.x FAMILY LAW (SK1, 2026-07-24): the RESIDENT text UNDER the swap slot executes
# pre-swap -> declared as overlay INDEX 0 (file offset = 0x738 - 0x80 = 0x6B8), never
# DMA-selected at runtime. GBI table = 40 u16 at data+0xB6 (33 unique, below).
# AeroGauge instance: text ROM 0x7DF00 (0x1800 contiguous), data ROM 0xC7E10,
# VRAM 0x8007D300/0x800C7210.
text_offset = 0x7DF00
text_size = 0x1000
text_address = 0x04001000
text_load_offset = 0x80
rom_file_path = "../aerogauge/baserom.z64"
output_file_path = "RecompiledFuncs/f3dexnon123.cpp"
