# Robotron 64 (USA) — splat-less Recompilator front-end config. GAME #5.
# Clean STANDARD layout (CIC-6102): entry 0x80000400, code base vram 0x80000400 = rom 0x1000
# (delta 0x7FFFF400). Recon (pw_recon/pw_recon2 on this ROM): ONE contiguous code segment
# rom 0x1000..~0x73000 (last jr-ra 0x72a64); constant delta 0x7FFFF400 window-by-window; no
# overlay region detected (simpler than Pilotwings). boot @ rom 0x1000 = BSS-clear stub
# (t0=0x80097290, clears 0x1003b0). mips3 float (ldc1=116/sdc1=271). data/assets rom ~0x79000+.
# FIRST-CUT boundaries; iterate vs verify_rom_match + the recomp jal census.
name: Robotron 64 (USA)
sha1: 285c720f642649790faaaa02c33636cf1b33d7db
options:
  basename: robotron
  target_path: baserom.z64
  base_path: .
  build_path: build
  asm_path: asm
  src_path: src
  asset_path: assets
  ld_script_path: build/robotron.ld
  compiler: IDO
  platform: n64
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  symbol_addrs_path: symbol_addrs.txt
  find_file_boundaries: false
  use_legacy_include_asm: false
  disassemble_all: true
  mips_abi_float_regs: numeric
segments:
  - name: header
    type: header
    start: 0x0
  - name: ipl3
    type: bin
    start: 0x40
  - name: main
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, asm, main]   # code + data + jtbls (rom 0x1000..0x79000). ONE asm subsegment
                              # keeps byte-order exact; data-as-code handled via robotron_stubs.txt.
  - name: assets
    type: bin
    start: 0x79000
  - [0x800000]
