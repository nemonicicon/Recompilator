# RSPRecomp config for 1080 Snowboarding's audio microcode (an aspMain variant; engine registry hash 70C8DAC54BD41A1F).
# 2026-09-03: the tree shipped a scaffold copy of sm64's aspMain.cpp; on this game's audio command lists it hit
# "Unhandled jump target 0x1148" from the first task and, running the wrong ABI, could DMA anywhere in RDRAM
# (the wild 0x01 heap fill at ~21 s). Source here = the game's own RDRAM capture: the task points its ucode text
# at 0xDC2C0 (0x1000 bytes) and its data at 0x84B20 (0x2DF bytes), both resident after boot.
text_offset = 0xDC2C0
text_size = 0xF80
# rspboot DMAs the ucode text to IMEM+0x80; aspMain's jump-table targets are IMEM-absolute (0x11xx..0x1Fxx).
text_address = 0x04001080
rom_file_path = "../g1080snowboarding/rdram_selfdecomp.bin"
output_file_path = "rsp/aspMain.cpp"
output_function_name = "aspMain"

# The audio command jump table: aspMain data words 0x10..0x30 (eight words, two 16-bit IMEM targets each),
# read from the capture at 0x84B20+0x10: 1F38122C 11481EE8 1DFC14F0 1E6C1CAC 117817C8 11E41AA0 1B30118C 1C58121C.
extra_indirect_branch_targets = [
    0x1F38, 0x122C, 0x1148, 0x1EE8, 0x1DFC, 0x14F0, 0x1E6C, 0x1CAC,
    0x1178, 0x17C8, 0x11E4, 0x1AA0, 0x1B30, 0x118C, 0x1C58, 0x121C,
]
