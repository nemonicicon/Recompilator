name: FIFA Soccer 64 (USA)
sha1: 603c5bf64497dca86c4eb802f97f1c32e75a68a8
options:
  basename: fifa
  target_path: baserom.z64
  base_path: .
  build_path: build
  asm_path: asm
  src_path: src
  asset_path: assets
  ld_script_path: build/fifa.ld
  compiler: IDO
  platform: n64
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  symbol_addrs_path: symbol_addrs.txt
  find_file_boundaries: false
  use_legacy_include_asm: false
  disassemble_all: false
  mips_abi_float_regs: numeric
segments:
  - name: header
    type: header
    start: 0x0
  - name: ipl3
    type: bin
    start: 0x40
  - name: main
    type: code
    start: 0x1000
    vram: 0x80000400
    # HONEST RESIDENT TYPING (2026-08-05, from the runtime capture — see
    # COMPRESSED_CLASS_ROSTER.md + fifa/rdram_selfdecomp.bin, sha1 3b1827be…):
    # fifa is a SELF-RELOCATING compressed title. Only 0x80000400..0x80003E00 survives
    # in RAM byte-identical to ROM (bootloader + libultra; runtime diffs beyond 0x3E00
    # are the bootloader's mutable data tail, plus 88 bytes inside HLE'd
    # osCreatePiManager). The 43 tiny "asm" slivers previously typed here were
    # code-looking fragments INSIDE the compressed stream — 100% of their bytes are
    # overwritten at runtime. Recompiling them created garbage funcs at payload vaddrs
    # that would SHADOW the RAM-shadow set on func_map hits (the audit's stated risk).
    # The decompressed body (0x800063C0..0x800E2C50, 2034 prologues) is carried by the
    # fifa_ram RAM-image recomp, not by this ROM recon.
    subsegments:
      - [0x1000, asm, main_80000400]
      - [0x1F94, asm, main_80001394]
      - [0x2800, asm, main_80001C00]
      - [0x4A00, bin, main_80003E00]
  - name: assets
    type: bin
    start: 0x101000
  - [0x800000]
