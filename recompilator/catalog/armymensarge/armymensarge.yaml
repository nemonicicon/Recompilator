name: Army Men - Sarge's Heroes (USA)
sha1: 1824380911579424e50042d45aef4851f7ab25a7
options:
  basename: armymensarge
  target_path: baserom.z64
  base_path: .
  build_path: build
  asm_path: asm
  src_path: src
  asset_path: assets
  ld_script_path: build/armymensarge.ld
  compiler: IDO
  platform: n64
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  symbol_addrs_path: symbol_addrs.txt
  find_file_boundaries: true
  use_legacy_include_asm: false
  disassemble_all: false
  mips_abi_float_regs: numeric
segments:
  - name: header
    type: header
    start: 0x0
  - name: ipl3
    type: bin
    start: 0x40
  - name: main
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, asm, main_80000400]
  - name: assets
    type: bin
    start: 0x101000
  - [0x800000]
