# Castlevania: Legacy of Darkness (USA) ??? splat-less Recompilator front-end config.
# SESSION 43 recon (empirical, no decomp exists):
#   entrypoint 0x80000400 (rom 0x1000), internal name CASTLEVANIA2, game code ND4E
#   main code   rom 0x1060..0xACF60  @ vram 0x80000460  (prologue-density scan + last jr-ra 0xACF54)
#   main data   rom 0xACF60..0xC1000 (Nisitenma-Ichigo table at rom 0xB1B88 ??? same engine as CV64)
#   common code rom 0xC1000..0x10D0F8 @ vram 0x80140750 (jal???prologue delta solve: 803 exact hits
#               for delta 0x8007F750, 6x the runner-up)
#   common data rom 0x10D0F8..0x118000 (estimate, iterate)
#   asset region 0x118000..~0x85C590, then NI compressed files to 0x1000000.
name: Castlevania - Legacy of Darkness (USA)
sha1: 879ead98f197fd05edda867655da5b1ce25aa5b8
options:
  basename: lod
  target_path: baserom.z64
  base_path: .
  build_path: build
  asm_path: asm
  src_path: src
  asset_path: assets
  ld_script_path: build/lod.ld
  compiler: IDO
  platform: n64
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  symbol_addrs_path: symbol_addrs.txt
  find_file_boundaries: false
  use_legacy_include_asm: false
  mips_abi_float_regs: numeric
segments:
  - name: header
    type: header
    start: 0x0
  - name: ipl3
    type: bin
    start: 0x40
  - name: entry
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, asm, entry]
  - name: main
    type: code
    start: 0x1060
    vram: 0x80000460
    subsegments:
      - [0x1060, asm, main]
      - [0xACF60, data, main_data]
  - name: common
    type: code
    start: 0xC1000
    vram: 0x80140750
    subsegments:
      - [0xC1000, asm, common]
      - [0x10D0F8, data, common_data]
  - name: assets
    type: bin
    start: 0x118000
  - [0x1000000]
