name: Turok Dinosaur Hunter (USA)
sha1: 40fb0250c095740031278fb1f82b9937a3895e01
options:
  basename: turok
  target_path: baserom.z64
  base_path: .
  build_path: build
  asm_path: asm
  src_path: src
  asset_path: assets
  ld_script_path: build/turok.ld
  compiler: IDO
  platform: n64
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  symbol_addrs_path: symbol_addrs.txt
  find_file_boundaries: false
  use_legacy_include_asm: false
  disassemble_all: false
  mips_abi_float_regs: numeric
segments:
  - name: header
    type: header
    start: 0x0
  - name: ipl3
    type: bin
    start: 0x40
  - name: main
    type: code
    start: 0x1000
    vram: 0x80000400
    # HONEST RESIDENT TYPING (2026-08-06, fifa pattern — see COMPRESSED_CLASS_ROSTER.md):
    # turok is a compressed title (probe win% 0.10, cw_prol 4). Sliver census over the ROM
    # (scratchpad turok_sliver_census.py): main_80000400 (2 prol, 11 jr-ra, ent 5.16) and
    # main_80000C7C (0 prol, 3 jr-ra, ent 4.50) = the real bootloader. The former
    # main_80001300 (1MB, ent 7.62, ZERO jr-ra, 0/247 healthy 4KB windows) and
    # main_800F919C (ent 7.73, 0/7) are the COMPRESSED PAYLOAD — code-lookalikes there
    # made the current N64Recomp emit non-compiling C (unbalanced braces, funcs_17.c).
    # The decompressed body belongs to the turok_ram RAM-image recomp, not this ROM recon.
    subsegments:
      - [0x1000, asm, main_80000400]
      - [0x187C, asm, main_80000C7C]
      - [0x1F00, bin, main_80001300]
  - name: assets
    type: bin
    start: 0x101000
  - [0x800000]
