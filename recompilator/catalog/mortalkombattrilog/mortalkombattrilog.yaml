name: Mortal Kombat Trilogy (USA)
sha1: 39b3cb20417c503f1c047d5037df814d1ccf90dd
options:
  basename: mortalkombattrilog
  target_path: baserom.z64
  base_path: .
  build_path: build
  asm_path: asm
  src_path: src
  asset_path: assets
  ld_script_path: build/mortalkombattrilog.ld
  compiler: IDO
  platform: n64
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  symbol_addrs_path: symbol_addrs.txt
  find_file_boundaries: false
  use_legacy_include_asm: false
  disassemble_all: false
  mips_abi_float_regs: numeric
segments:
  - name: header
    type: header
    start: 0x0
  - name: ipl3
    type: bin
    start: 0x40
  - name: main
    type: code
    start: 0x1000
    vram: 0x80001000
    subsegments:
      - [0x1000, asm, main_80001000]
      - [0x990B8, asm, main_800990B8]
      - [0x993D0, asm, main_800993D0]
      - [0xA642C, asm, main_800A642C]
      - [0xA6448, bin, main_800A6448]
      - [0xB001C, bin, main_800B001C]
      - [0xB25EC, bin, main_800B25EC]
