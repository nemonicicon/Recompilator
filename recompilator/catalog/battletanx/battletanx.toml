# [pollhook 2026-09-06, BattleTanx #293] func_80079064 is the game's boot wait: it snapshots the
# 0x200-byte scheduler block at 0x8014E0D0 onto the stack every iteration and spins until the
# retrace counter at +0x1F0 reaches 5 (and +0x1F4 / +0x1FC clear). That counter is incremented by
# the game's OWN scheduler thread (t=3, func_80078F70), which can only run when a guest thread
# pumps external messages -- and this loop makes NO OS call, so nothing is ever pumped and the
# scheduler never receives a VI retrace. MEASURED: hog-sampler 1546/1554 samples in func_80079064
# with dmarks=0; 15 thread switches in 20 s; [schedyield] 0; 0 RSP tasks ever submitted.
# All four poll-loop detectors reject this back edge (it is conditional, its body STORES the
# 512-byte snapshot, and it contains an inner branch), so no guard is emitted. Marking the
# once-per-iteration point after the snapshot as a yield point restores the preemption hardware
# would have delivered via the VI interrupt. Same emitted guard the detectors use.
[[patches.hook]]
func = "func_80079064"
before_vram = 0x800790B8
text = 'if ((++poll_guard & 0x3F) == 0) { yield_self_poll(rdram, 0x80079064u, (uint32_t)ctx->r31, 0x800790B8u); }'
