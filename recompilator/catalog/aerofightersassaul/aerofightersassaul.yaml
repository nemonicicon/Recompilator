name: AeroFighters Assault (USA)
sha1: 6742f67d7d2639072e186d240237be1c662cb25a
options:
  basename: aerofightersassaul
  target_path: baserom.z64
  base_path: .
  build_path: build
  asm_path: asm
  src_path: src
  asset_path: assets
  ld_script_path: build/aerofightersassaul.ld
  compiler: IDO
  platform: n64
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  symbol_addrs_path: symbol_addrs.txt
  find_file_boundaries: false
  use_legacy_include_asm: false
  disassemble_all: false
  mips_abi_float_regs: numeric
segments:
  - name: header
    type: header
    start: 0x0
  - name: ipl3
    type: bin
    start: 0x40
  - name: main
    type: code
    start: 0x1000
    vram: 0x80200050   # resident image: rom 0x1000..0x57D20 -> vram 0x80200050..0x80256D70
                       # (delta 0x801FF050). The game's own memory-map printf at rom 0x31D84
                       # builds 0x80256D70 as the resident end and 0x80287430 as the next
                       # segment's base; their difference 0x306C0 is the BSS hole.
    subsegments:
      - [0x1000, asm, main_80200050]
      - [0x42CC4, asm, main_80241D14]
      - [0x43090, asm, main_802420E0]
      - [0x572A0, asm, main_802562F0]
      - [0x57AA0, bin, main_80256AF0]
      - [0x57CF0, asm, main_80256D40]
  - name: main2
    type: code
    start: 0x57D20
    vram: 0x80287430   # SECOND CODE SEGMENT (delta 0x8022F710). PI-DMA'd linearly from cart in
                       # 0x1000 chunks: the diag log's first transfer is
                       # cart=0x10057D20 -> dram=0x00287430 len=0x1000, then 23 more in lockstep.
                       # Text ends at vram 0x803233C0 (rom 0xF3CB0) and the loaded image ends at
                       # vram 0x80348C40 (rom 0x119530) - both are the game's own linker constants,
                       # printed by the same memory-map routine (0x8035_0000-0x6AD0 = 0x80349530
                       # is the segment's bss end, 0x12_0000-0x6AD0 = 0x119530 the rom end).
                       # Confirmed independently: the jump table the recompiler could not size,
                       # vram 0x80343CE4, is rom 0x1145D4 under this delta and holds 0x802E0Bxx
                       # switch targets for the function at rom 0xB1400.
    subsegments:
      - [0x57D20, asm, main2_80287430]
      - [0xF3CB0, bin, main2_803233C0]
  - name: assets
    type: bin
    start: 0x119530
  - [0x800000]
