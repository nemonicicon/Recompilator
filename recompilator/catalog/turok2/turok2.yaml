name: Turok 2 Seeds of Evil (USA)
sha1: fb0400f21e3f043939ab56500c7b12a3231006f1
options:
  basename: turok2
  target_path: baserom.z64
  base_path: .
  build_path: build
  asm_path: asm
  src_path: src
  asset_path: assets
  ld_script_path: build/turok2.ld
  compiler: IDO
  platform: n64
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  symbol_addrs_path: symbol_addrs.txt
  find_file_boundaries: false
  use_legacy_include_asm: false
  disassemble_all: true
  mips_abi_float_regs: numeric
segments:
  - name: header
    type: header
    start: 0x0
  - name: ipl3
    type: bin
    start: 0x40
  # THE ACCLAIM LONDON MEMORY MODEL (decoded 2026-08-06 15:10, boot-stub disassembly +
  # live [tlb] log): the entry stub (rom 0x1000..0x15F0) runs at KSEG0 0x80000400, unmaps
  # the TLB, maps virtual 0x00200000..0x003FFFFF -> phys 0x0..0x1FFFFF (1MB pages, idx 31)
  # via its own tlbwi helper, then jalr's to virtual 0x0028D380. THE GAME BODY IS LINKED AT
  # THE WINDOW: virtual = 0x200000 + phys (rom 0x1000 <-> phys 0x400). Recompiling the body
  # at vram 0x800004xx mis-targets every jal by the base difference (proof: the wait loop at
  # virt 0x276B94 jal-encodes 0x002113A4 = phys 0x113A4; the 0x80-based recomp called
  # func_802113A4 = phys 0x2113A4 = empty assets). Boot stub and body get their TRUE
  # execution bases as separate segments. Census code runs: 0x1000..0xA5000 +
  # 0xC2000..0xDE000; data between/after.
  - name: boot
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, asm, boot_80000400]
  - name: main
    type: code
    start: 0x1100
    vram: 0x00200500
    subsegments:
      - [0x1100, asm, main_00200500]
      - [0xA5000, bin, main_002A4400]
      - [0xC2000, asm, main_002C1400]
      - [0xDE000, bin, main_002DD400]
  - name: assets
    type: bin
    start: 0x101000
  - [0x2000000]
