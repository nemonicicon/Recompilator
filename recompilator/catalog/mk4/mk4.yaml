name: Mortal Kombat 4 (USA)
sha1: f47d05bbd1bcadddff2ec7a21bc2e795cbef9f9b
options:
  basename: mk4
  target_path: baserom.z64
  base_path: .
  build_path: build
  asm_path: asm
  src_path: src
  asset_path: assets
  ld_script_path: build/mk4.ld
  compiler: IDO
  platform: n64
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt
  symbol_addrs_path: symbol_addrs.txt
  find_file_boundaries: false
  use_legacy_include_asm: false
  disassemble_all: false
  mips_abi_float_regs: numeric
segments:
  - name: header
    type: header
    start: 0x0
  - name: ipl3
    type: bin
    start: 0x40
  - name: main
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, asm, main_80000400]
      - [0x10A4, asm, main_800004A4]
      - [0x1C9E4, asm, main_8001BDE4]
      - [0x1CDC0, asm, main_8001C1C0]
      - [0x370C0, asm, main_800364C0]
      - [0x4F740, data, main_8004EB40]
      - [0x50210, asm, main_8004F610]
      - [0x5028C, bin, main_8004F68C]
  - name: game
    type: code
    start: 0x51400
    vram: 0x80132000
    subsegments:
      - [0x51400, asm, game_80132000]
      - [0xF7400, data, game_801D8000]
  - name: assets
    type: bin
    start: 0x12ACA0
  - [0x1000000]
