# Located STATICALLY from the ROM (no run, no decomp): version string @ROM 0xC0800 ⇒ data base
# 0xC0550 (1.x law: string@data+0x2B0); text found by family boot-preamble alignment @ROM 0x2010
# (16/16 opcode match vs the 1.23 head; first word differs by 2 bits — prefix search misses it).
